name: Build & Package DoomScroller APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Inspect & Display APK Size
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          if [ -f "$APK_PATH" ]; then
            SIZE_BYTES=$(stat -c%s "$APK_PATH")
            SIZE_HUMAN=$(ls -lh "$APK_PATH" | awk '{print $5}')
            echo "============================================="
            echo "DoomScroller APK Built Successfully!"
            echo "APK Location: $APK_PATH"
            echo "APK Size: $SIZE_HUMAN ($SIZE_BYTES bytes)"
            echo "============================================="
            echo "### 📱 DoomScroller APK Build Summary" >> $GITHUB_STEP_SUMMARY
            echo "- **Status**: ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "- **File**: \`$(basename "$APK_PATH")\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Size**: **$SIZE_HUMAN** ($SIZE_BYTES bytes)" >> $GITHUB_STEP_SUMMARY
          else
            echo "APK not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DoomScroller-v1.0.0-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
